[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "i7-acceptance"
path = "src/bin/i7_acceptance.rs"

[[bin]]
name = "system-release-acceptance"
path = "src/bin/system_release_acceptance.rs"

[[bin]]
name = "f1-diagnostic"
path = "src/bin/f1_diagnostic.rs"


[lints]
workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
harness-runtime = { path = "../harness-runtime" }
harness-adapters = { path = "../harness-adapters" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
